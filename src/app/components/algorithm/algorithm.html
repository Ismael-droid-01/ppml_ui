<mat-card class="dashboard-card">
  <mat-card-header class="dashboard-header">
    <mat-card-title>Model Configuration</mat-card-title>
  </mat-card-header>

  <mat-card-content align="center">
    <div class="section-row center">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Select an algorithm</mat-label>
        <mat-select (selectionChange)="onAlgorithmSelected($event.value)">
          <mat-option *ngFor="let algorithm of algorithms$ | async" [value]="algorithm">
            {{ algorithm.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="parameters-grid" *ngIf="parameters$ | async as params">

      <mat-form-field appearance="fill" *ngFor="let param of params.numeric_parameters">
        <mat-label>{{ param.name }}</mat-label>
        <input matInput [type]="param.type === 'INTEGER' ? 'number' : 'number'" [value]="param.default_value"
          [max]="param.max_value" [step]="param.type === 'FLOAT' ? 0.01 : 1">
      </mat-form-field>

      <mat-form-field appearance="fill" *ngFor="let param of params.string_parameters">
        <mat-label>{{ param.name }}</mat-label>
        <input matInput type="text" [value]="param.default_value">
      </mat-form-field>

    </div>

    <div class="parameters-grid" *ngIf="!(parameters$ | async)">
      <p style="color: gray;">Select an algorithm to see its parameters.</p>
    </div>

    <div class="dataset-actions">
      <mat-form-field appearance="outline" class="dataset-selector">
        <mat-label>Select a loaded dataset</mat-label>
        <mat-select [disabled]="uploadCheck.checked">
          <mat-option value="ds1">Customer_Data_v1.csv</mat-option>
          <mat-option value="ds2">Sales_Encrypted_2025.csv</mat-option>
          <mat-option value="ds3">Training_Set_Alpha.csv</mat-option>
        </mat-select>
        <mat-icon matSuffix>storage</mat-icon>
      </mat-form-field>

      <div class="upload-status">
        <mat-checkbox #uploadCheck color="primary" class="upload-checkbox">
          Upload a new dataset
        </mat-checkbox>
      </div>
    </div>

    <div class="drop-zone" *ngIf="uploadCheck.checked">
      <mat-icon>backup</mat-icon>
      <p>Drag a dataset here</p>
    </div>

    <div class="run-container">
      <button mat-raised-button color="primary" class="run-button">
        RUN
      </button>
    </div>
  </mat-card-content>
</mat-card>
